[package]
name = "unbaked-mcp"
description = "MCP tool: make pictures and sounds by paying the unbaked-api server with x402, and do Unbaked file work locally for free"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "unbaked-mcp"
path = "src/main.rs"

[dependencies]
alloy-primitives = "1"
alloy-signer-local = "2.0"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "rustls"] }
reqwest-middleware = "0.5"
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unbaked-core = { git = "https://github.com/1xmint/unbaked", rev = "fb1dfbf" }
unbaked-render = { git = "https://github.com/1xmint/unbaked", rev = "fb1dfbf", default-features = false }
base64 = "0.22.1"
x402-chain-eip155 = { version = "2.0", features = ["client", "telemetry"] }
x402-reqwest = "2.0.2"
x402-types = "2.0"

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
rmcp = { version = "3.3.0", features = ["client"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
unbaked-api = { path = "../server", features = ["fake"] }
unbaked-pay = { path = "../pay", features = ["fake"] }

[lints]
workspace = true
