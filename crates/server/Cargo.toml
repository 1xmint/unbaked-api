[package]
name = "unbaked-api"
description = "Paid x402 HTTP API over Unbaked"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unbaked-core = { git = "https://github.com/1xmint/unbaked", rev = "fb1dfbf" }
unbaked-pay = { path = "../pay" }
unbaked-render = { git = "https://github.com/1xmint/unbaked", rev = "fb1dfbf", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
unbaked-pay = { path = "../pay", features = ["fake"] }

[lints]
workspace = true
